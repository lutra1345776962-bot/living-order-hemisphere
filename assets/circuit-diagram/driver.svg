rect x="575" y="639" width="50" height="22" fill="white" stroke="#111111" stroke-width="3"/><text x="600" y="628" font-size="24" text-anchor="middle">220Ω</text><text x="850" y="745" font-size="24" text-anchor="middle"></text><text x="850" y="792" font-size="24" text-anchor="middle"></text><rect x="839" y="735" width="22" height="50" fill="white" stroke="#111111" stroke-width="3"/><text x="877" y="769" font-size="24" text-anchor="start">10kΩ</text><text x="150" y="335" font-size="24" text-anchor="middle"></text><text x="165" y="268" font-size="29" text-anchor="start">逻辑5V（JP1后）</text><text x="1620" y="1505" font-size="28" text-anchor="start">本地GND → 独立动力回线 → 公共0V</text><text x="2110" y="535" font-size="24" text-anchor="middle"></text><text x="2110" y="585" font-size="24" text-anchor="middle"></text><path d="M2155 500 a14 5 0 0 1 0 10 a14 5 0 0 1 0 10 a14 5 0 0 1 0 10 a14 5 0 0 1 0 10 a14 5 0 0 1 0 10" fill="none" stroke="#111111" stroke-width="3"/><text x="2150" y="588" font-size="27" text-anchor="middle">本路线圈</text><text x="1820" y="850" font-size="24" text-anchor="middle"></text><text x="1820" y="897" font-size="24" text-anchor="middle"></text><rect x="1809" y="840" width="22" height="50" fill="white" stroke="#111111" stroke-width="3"/><text x="1847" y="874" font-size="24" text-anchor="start">Rd 见下方</text><text x="1980" y="758" font-size="26" text-anchor="start">原板10k上拉至SLEEP</text><text x="1980" y="800" font-size="26" text-anchor="start">新增Rd接VREF到GND</text><text x="1700" y="1035" font-size="24" text-anchor="middle"></text><text x="1700" y="1082" font-size="24" text-anchor="middle"></text><rect x="1689" y="1025" width="22" height="50" fill="white" stroke="#111111" stroke-width="3"/><text x="1727" y="1059" font-size="24" text-anchor="start">2.49kΩ</text><text x="1727" y="1138" font-size="22" text-anchor="start">原板保留</text><text x="1900" y="1180" font-size="26" text-anchor="start">开漏FAULT → 公共F端子 → Nano D4</text><path d="M1937 1352 H1983 M1937 1368 H1983" fill="non