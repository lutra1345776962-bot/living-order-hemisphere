<polygon points="1100,650 1084.341963101951,656.6201118192471 1084.341963101951,643.3798881807529" fill="#246E50"/>
<text x="680" y="631.12" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#246E50">导向压头</text>
<text x="680" y="541.12" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#246E50">k≈5N/mm</text>
<rect x="545" y="1000" width="65" height="270" fill="#A8B1B8" stroke="#172A38" stroke-width="2"/>
<rect x="365" y="1030" width="180" height="135" fill="#E8B88F" stroke="#AD4B09" stroke-width="2"/>
<rect x="610" y="1030" width="180" height="135" fill="#E8B88F" stroke="#AD4B09" stroke-width="2"/>
<text x="680" y="1263.76" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#AD4B09">M0与磁芯独立固定</text>
<polyline points="575,1270 575,1330" fill="none" stroke="#AD4B09" stroke-width="4"/>
<polygon points="575,1330 568.3798881807529,1314.341963101951 581.6201118192471,1314.341963101951" fill="#AD4B09"/>
<text x="125" y="1406.4" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#172A38">传感器与绕组分开：留约24mm夹层，必要时中央组件下移。</text>
<rect x="1240" y="240" width="875" height="1080" fill="#F3F7FA" stroke="#8AA0AE" stroke-width="2"/>
<text x="1260" y="285.92" font-family="Microsoft YaHei,sans-serif" font-size="34" fill="#172A38">实体装配要点</text>
<text x="1260" y="334.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">1  三点周边导向，防止偏载使板倾斜。</text>
<text x="1260" y="376.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">   导向滑动，不锁死，也不旁路承重。</text>
<text x="1260" y="418.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38"></text>
<text x="1260" y="460.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">2  板重约3.75N使弹簧预压约0.75mm。</text>
<text x="1260" y="502.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">   轻按时整板再下沉0—2mm。</text>
<text x="1260" y="544.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38"></text>
<text x="1260" y="586.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">3  三只下限位留2.0mm静态间隙。</text>
<text x="1260" y="628.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">   理想总力约14N；实测上限须&lt;25N。</text>
<text x="1260" y="670.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">   限位接触后，多余力经固定架旁路。</text>
<text x="1260" y="712.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38"></text>
<text x="1260" y="754.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">4  传感器有效受力点仅受轴向压缩。</text>
<text x="1260" y="796.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">   下座按原厂固定环面支撑，中心退让。</text>
<text x="1260" y="838.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38"></text>
<text x="1260" y="880.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">5  传感器钢体可能受磁场/温度干扰。</text>
<text x="1260" y="922.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">   必须做无人按压、开关线圈的零点测试。</text>
<text x="1260" y="964.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38"></text>
<text x="1260" y="1006.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">6  HX711放底座，尽量离绕组≥150mm。</text>
<text x="1260" y="1048.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">   原配屏蔽桥线与动力线分路。</text>
<text x="1260" y="1090.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38"></text>
<text x="1260" y="1132.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#172A38">这是轻按功能样机，不能承受人坐/踩。</text>
<text x="65" y="1504.64" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#52636D">顶板自身保持平面；下沉时相对边框略低。剖面不代表已通过强度、磁路或温升验证。</text>
</svg>