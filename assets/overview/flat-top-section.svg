<text x="1090" y="450.52" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#246E50">2.0</text>
<polyline points="630,750 1110,750" fill="none" stroke="#AD4B09" stroke-width="3"/>
<polygon points="1110,750 1094.341963101951,756.6201118192471 1094.341963101951,743.3798881807529" fill="#AD4B09"/>
<text x="210" y="726.12" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#AD4B09">LLB130 Ø9.5×3.3</text>
<polyline points="645,350 1100,350" fill="none" stroke="#246E50" stroke-width="3"/>
<polygon points="1100,350 1084.341963101951,356.6201118192471 1084.341963101951,343.3798881807529" fill="#246E50"/>
