<text x="220" y="870.52" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#172A38">独立承压固定架 → 柱身</text>
<rect x="183" y="330" width="24" height="310" fill="#E4E9ED" stroke="#52636D" stroke-width="2"/>
