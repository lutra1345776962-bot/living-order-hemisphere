<text x="65" y="90.75999999999999" font-family="Microsoft YaHei,sans-serif" font-size="52" fill="#172A38">03  平顶夹层的传力与限位</text>
<text x="65" y="141.76" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#52636D">装置级剖面示意，纵向夸张，不是传感器制造图  /  所有自定尺寸均为试制值，单位mm</text>
